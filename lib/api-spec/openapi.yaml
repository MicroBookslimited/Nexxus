openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Nexus POS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog
  - name: variants
    description: Product variants and modifiers
  - name: orders
    description: Order management
  - name: held-orders
    description: Held (parked) order management
  - name: quotations
    description: Customer price quotations
  - name: dashboard
    description: Dashboard analytics
  - name: customers
    description: Customer management
  - name: reports
    description: Business reports
  - name: tables
    description: Restaurant table management
  - name: kitchen
    description: Kitchen display system
  - name: purchases
    description: Stock purchase management
  - name: purchase-bills
    description: Multi-product purchase bill management
  - name: purchase-orders
    description: Purchase order management (ordering document for suppliers)
  - name: staff
    description: Staff accounts and roles
  - name: cash
    description: Cash drawer and shift management
  - name: composite
    description: Composite (bundle) product management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: includeArchived
          in: query
          description: When true, include soft-deleted (archived) products in the response. Defaults to false.
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/bulk-archive:
    post:
      operationId: bulkArchiveProducts
      tags: [products]
      summary: Archive (soft-delete) multiple products. History is preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkProductIdsBody"
      responses:
        "200":
          description: Number of products archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkProductsResult"

  /products/bulk-restore:
    post:
      operationId: bulkRestoreProducts
      tags: [products]
      summary: Restore previously archived products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkProductIdsBody"
      responses:
        "200":
          description: Number of products restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkProductsResult"

  /products/find-duplicates:
    get:
      operationId: findDuplicateProducts
      tags: [products]
      summary: Find groups of duplicate products by name (exact + fuzzy similar matches).
      parameters:
        - name: staffId
          in: query
          required: true
          description: Staff member performing the lookup (must be Owner/Admin or have inventory.manage).
          schema:
            type: integer
      responses:
        "200":
          description: Groups of potential duplicate products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateGroup"

  /products/categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List all distinct categories actually used by the tenant's products (including archived), so callers can union them with the curated settings list.
      responses:
        "200":
          description: Distinct product category names in use
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /products/merge:
    post:
      operationId: mergeProducts
      tags: [products]
      summary: Merge duplicate products into one survivor, combining stock and re-attributing all history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeProductsBody"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeProductsResult"

  /products/{id}/customize:
    get:
      operationId: getProductCustomization
      tags: [variants]
      summary: Get full variant groups + modifier groups for POS customization dialog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product customization data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCustomization"
        "404":
          description: Not found

  /products/{id}/variants:
    get:
      operationId: getProductVariants
      tags: [variants]
      summary: Get all variant groups with options and combinations for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Variant groups and combinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProductVariantsResponse"
    put:
      operationId: saveProductVariants
      tags: [variants]
      summary: Replace all variant groups for a product (full overwrite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveVariantsBody"
      responses:
        "200":
          description: Saved variant groups and combinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProductVariantsResponse"

  /products/{id}/modifiers:
    get:
      operationId: getProductModifiers
      tags: [variants]
      summary: Get all modifier groups with options for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modifier groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModifierGroup"
    put:
      operationId: saveProductModifiers
      tags: [variants]
      summary: Replace all modifier groups for a product (full overwrite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModifiersBody"
      responses:
        "200":
          description: Saved modifier groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModifierGroup"

  /products/{id}/composite-components:
    get:
      operationId: getCompositeComponents
      tags: [composite]
      summary: List components of a composite (bundle) product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Component list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompositeComponent"
        "404":
          description: Parent product not found
    put:
      operationId: saveCompositeComponents
      tags: [composite]
      summary: Replace all components of a composite product (full overwrite)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCompositeComponentsBody"
      responses:
        "200":
          description: Saved component list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompositeComponent"
        "400":
          description: Validation error (e.g. self-reference, circular reference, missing child)
        "404":
          description: Parent product not found

  /products/{id}/composite-cost:
    get:
      operationId: getCompositeCost
      tags: [composite]
      summary: Get derived cost / margin for a composite product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cost breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositeCost"
        "404":
          description: Product not found

  /products/{id}/available-composite-quantity:
    get:
      operationId: getAvailableComposite
      tags: [composite]
      summary: How many bundles can be assembled from current child stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: locationId
          in: query
          description: Optional — when set, calculation uses location_inventory instead of global product stock.
          schema:
            type: integer
      responses:
        "200":
          description: Available bundle count + per-component breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableComposite"
        "404":
          description: Product not found

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, pending, completed, cancelled, refunded, voided]
        - name: limit
          in: query
          schema:
            type: integer
        - name: from
          in: query
          description: Start date (YYYY-MM-DD, Jamaica timezone). Inclusive.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          description: End date (YYYY-MM-DD, Jamaica timezone). Inclusive (end-of-day).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: staffId
          in: query
          description: Filter to orders rung up by this staff member.
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (also used for refund/void)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/refund-items:
    post:
      operationId: refundOrderItems
      tags: [orders]
      summary: Refund specific items / quantities from a completed order (partial refund)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundOrderItemsBody"
      responses:
        "200":
          description: Updated order (status stays completed while partial, flips to refunded when fully refunded), plus the store-credit voucher issued when refundToVoucher is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundOrderItemsResult"

  /orders/{id}/charge:
    post:
      operationId: chargeOrder
      tags: [orders]
      summary: Complete payment on an open (sent-to-kitchen) order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOrderBody"
      responses:
        "200":
          description: Completed order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /held-orders:
    get:
      operationId: listHeldOrders
      tags: [held-orders]
      summary: List all held (parked) orders
      responses:
        "200":
          description: List of held orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeldOrder"
    post:
      operationId: createHeldOrder
      tags: [held-orders]
      summary: Park (hold) the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHeldOrderBody"
      responses:
        "201":
          description: Created held order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldOrder"

  /held-orders/{id}:
    get:
      operationId: getHeldOrder
      tags: [held-orders]
      summary: Recall a held order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Held order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldOrder"
    delete:
      operationId: deleteHeldOrder
      tags: [held-orders]
      summary: Delete a held order (after recall or dismiss)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /quotations:
    get:
      operationId: listQuotations
      tags: [quotations]
      summary: List all quotations
      responses:
        "200":
          description: List of quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [quotations]
      summary: Create a quotation from the current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationBody"
      responses:
        "201":
          description: Created quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"

  /quotations/{id}:
    get:
      operationId: getQuotation
      tags: [quotations]
      summary: Get a quotation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    patch:
      operationId: updateQuotation
      tags: [quotations]
      summary: Update a quotation (status / conversion / notes / expiry)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationBody"
      responses:
        "200":
          description: Updated quotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
    delete:
      operationId: deleteQuotation
      tags: [quotations]
      summary: Delete a quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /gift-vouchers:
    get:
      operationId: listGiftVouchers
      tags: [gift-vouchers]
      summary: List gift vouchers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, partially_redeemed, redeemed, expired, cancelled]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of gift vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GiftVoucher"
    post:
      operationId: createGiftVoucher
      tags: [gift-vouchers]
      summary: Issue a new gift voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftVoucherBody"
      responses:
        "201":
          description: Issued gift voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftVoucher"

  /gift-vouchers/reports:
    get:
      operationId: getGiftVoucherReports
      tags: [gift-vouchers]
      summary: Gift voucher liability and per-cashier summary
      responses:
        "200":
          description: Voucher reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftVoucherReports"

  /gift-vouchers/{id}/cancel:
    post:
      operationId: cancelGiftVoucher
      tags: [gift-vouchers]
      summary: Cancel (void) a gift voucher, zeroing its remaining balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelGiftVoucherBody"
      responses:
        "200":
          description: Cancelled gift voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftVoucher"

  /gift-vouchers/lookup/{code}:
    get:
      operationId: lookupGiftVoucher
      tags: [gift-vouchers]
      summary: Look up a gift voucher by its code (for redemption)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gift voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftVoucher"
        "404":
          description: Not found

  /gift-vouchers/{id}:
    get:
      operationId: getGiftVoucher
      tags: [gift-vouchers]
      summary: Get a gift voucher by ID with its transaction history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gift voucher with history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GiftVoucher"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-orders:
    get:
      operationId: getRecentOrders
      tags: [dashboard]
      summary: Get recent orders for dashboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /dashboard/sales-by-category:
    get:
      operationId: getSalesByCategory
      tags: [dashboard]
      summary: Get sales grouped by product category
      responses:
        "200":
          description: Sales by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySales"

  /dashboard/daily-sales:
    get:
      operationId: getDailySales
      tags: [dashboard]
      summary: Get daily revenue for the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daily sales data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailySales"

  /dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [dashboard]
      summary: Get top selling products by revenue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopProduct"

  /dashboard/payment-methods:
    get:
      operationId: getPaymentMethodBreakdown
      tags: [dashboard]
      summary: Get revenue breakdown by payment method
      responses:
        "200":
          description: Payment method breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodSales"

  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/by-card/{cardNumber}:
    get:
      operationId: getCustomerByCard
      tags: [customers]
      summary: Look up a customer by loyalty card number
      parameters:
        - name: cardNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: No customer with that card number

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
