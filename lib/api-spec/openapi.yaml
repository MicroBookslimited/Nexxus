components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProductUnit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        baseUnit:
          type: string
        conversionFactor:
          type: number
          format: float
      required:
        - id
        - name
        - baseUnit
        - conversionFactor

    CreateProductUnitBody:
      type: object
      properties:
        name:
          type: string
        baseUnit:
          type: string
        conversionFactor:
          type: number
          format: float
      required:
        - name
        - conversionFactor

    UpdateProductUnitBody:
      type: object
      properties:
        name:
          type: string
        baseUnit:
          type: string
        conversionFactor:
          type: number
          format: float

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        inStock:
          type: boolean
        stockCount:
          type: integer
        soldByWeight:
          type: boolean
        unitOfMeasure:
          type: string
          enum: [kg, lb, oz, g]
          nullable: true
        sellingUnit:
          type: string
          nullable: true
          description: Optional free-text selling unit / UOM label (e.g. "each", "case", "pieces"). Display-only; shown on the POS cart line and receipts. NULL = not set.
        costPrice:
          type: number
          format: float
          nullable: true
          description: Per-unit acquisition cost. Used for COGS / margin reports.
        structureType:
          type: string
          enum: [simple, composite]
          description: Product structure. Composite parents derive cost from child components.
        isTaxable:
          type: boolean
          description: When false, sales tax is not applied to this product at checkout.
        trackBatches:
          type: boolean
          description: When true, stock for this product is tracked per-batch with batch/lot numbers and optional expiry dates.
        stockMethodOverride:
          type: string
          enum: [fifo, lifo]
          nullable: true
          description: Per-product override of the tenant-wide FIFO/LIFO stock method.
        hasVariants:
          type: boolean
        hasModifiers:
          type: boolean
        isComposite:
          type: boolean
          description: True when this product has at least one composite component row.
        createdAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft-delete timestamp. When set the product is archived (hidden from catalog/POS/menu) but its history is preserved. NULL = active.
      required:
        - id
        - name
        - price
        - category
        - inStock
        - stockCount
        - soldByWeight
        - structureType
        - isTaxable
        - hasVariants
        - hasModifiers
        - isComposite
        - createdAt

    BulkProductIdsBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
      required:
        - ids

    BulkProductsResult:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    DuplicateProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price:
          type: number
          format: float
        stockCount:
          type: number
          format: float
        barcode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        hasVariants:
          type: boolean
        hasModifiers:
          type: boolean
        isComposite:
          type: boolean
        isCompositeChild:
          type: boolean
        mergeable:
          type: boolean
          description: True when the product is a simple SKU eligible for merging (not variant/composite/composite-child).
      required:
        - id
        - name
        - category
        - price
        - stockCount
        - createdAt
        - hasVariants
        - hasModifiers
        - isComposite
        - isCompositeChild
        - mergeable

    DuplicateGroup:
      type: object
      properties:
        key:
          type: string
          description: Normalized name shared by the group.
        matchType:
          type: string
          enum: [exact, similar]
        products:
          type: array
          items:
            $ref: "#/components/schemas/DuplicateProduct"
      required:
        - key
        - matchType
        - products

    MergeProductsBody:
      type: object
      properties:
        survivorId:
          type: integer
          description: The product that remains after the merge.
        mergeIds:
          type: array
          items:
            type: integer
          minItems: 1
          description: Products to merge into the survivor (must not include survivorId).
        staffId:
          type: integer
          description: Staff member performing the merge (must be Owner/Admin or have inventory.manage).
      required:
        - survivorId
        - mergeIds
        - staffId

    MergeProductsResult:
      type: object
      properties:
        survivorId:
          type: integer
        mergedCount:
          type: integer
        combinedStock:
          type: number
          format: float
      required:
        - survivorId
        - mergedCount
        - combinedStock

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        imageUrl:
          type: string
        barcode:
          type: string
        sku:
          type: string
        inStock:
          type: boolean
        stockCount:
          type: number
          format: float
        soldByWeight:
          type: boolean
        unitOfMeasure:
          type: string
          enum: [kg, lb, oz, g]
        sellingUnit:
          type: string
          nullable: true
          description: Optional free-text selling unit / UOM label (e.g. "each", "case", "pieces"). Display-only; shown on the POS cart line and receipts.
        costPrice:
          type: number
          format: float
          nullable: true
        structureType:
          type: string
          enum: [simple, composite]
        isTaxable:
          type: boolean
          description: When false, sales tax is not applied to this product at checkout.
        trackBatches:
          type: boolean
          description: When true, stock for this product is tracked per-batch with batch/lot numbers and optional expiry dates.
        stockMethodOverride:
          type: string
          enum: [fifo, lifo]
          nullable: true
          description: Per-product override of the tenant-wide FIFO/LIFO stock method. Null = inherit setting.
      required:
        - name
        - price
        - category

    CompositeComponent:
      type: object
      description: One child product inside a composite (bundle) parent.
      properties:
        id:
          type: integer
        parentProductId:
          type: integer
        childProductId:
          type: integer
        childName:
          type: string
        childSku:
          type: string
          nullable: true
        childCostPrice:
          type: number
          format: float
          nullable: true
        quantityRequired:
          type: number
          format: float
        unitId:
          type: integer
          nullable: true
        lineCost:
          type: number
          format: float
          description: childCostPrice * quantityRequired (0 when childCostPrice is null)
      required:
        - id
        - parentProductId
        - childProductId
        - childName
        - quantityRequired
        - lineCost

    CompositeComponentInput:
      type: object
      properties:
        childProductId:
          type: integer
        quantityRequired:
          type: number
          format: float
        unitId:
          type: integer
          nullable: true
      required:
        - childProductId
        - quantityRequired

    SaveCompositeComponentsBody:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/CompositeComponentInput"
      required:
        - components

    CompositeCost:
      type: object
      description: Live cost / margin breakdown for a composite parent.
      properties:
        productId:
          type: integer
        sellingPrice:
          type: number
          format: float
        derivedCost:
          type: number
          format: float
        grossProfit:
          type: number
          format: float
        grossMarginPct:
          type: number
          format: float
        components:
          type: array
          items:
            $ref: "#/components/schemas/CompositeComponent"
      required:
        - productId
        - sellingPrice
        - derivedCost
        - grossProfit
        - grossMarginPct
        - components

    AvailableCompositeComponent:
      type: object
      properties:
        childProductId:
          type: integer
        childName:
          type: string
        stock:
          type: number
          format: float
        quantityRequired:
          type: number
          format: float
        possibleBundles:
          type: integer
      required:
        - childProductId
        - childName
        - stock
        - quantityRequired
        - possibleBundles

    AvailableComposite:
      type: object
      description: How many bundles can be assembled from current child stock.
      properties:
        productId:
          type: integer
        available:
          type: integer
          description: MIN(floor(child.stock / quantityRequired)) across components.
        components:
          type: array
          items:
            $ref: "#/components/schemas/AvailableCompositeComponent"
      required:
        - productId
        - available
        - components

    Order:
      type: object
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        status:
          type: string
          enum: [open, pending, ready, completed, cancelled, refunded, voided]
        subtotal:
          type: number
          format: float
        discountType:
          type: string
          enum: [percent, fixed]
          nullable: true
        discountAmount:
          type: number
          format: float
          nullable: true
        discountValue:
          type: number
          format: float
          nullable: true
        tax:
          type: number
          format: float
        serviceCharge:
          type: number
          format: float
          nullable: true
          description: Dine-in service charge (restaurant mode). A percentage of the post-discount goods subtotal, applied only to dine-in orders when the tenant enables it. GCT is charged on top of this amount. 0/null = none. Server-computed.
        total:
          type: number
          format: float
        refundedTotal:
          type: number
          format: float
          nullable: true
          description: Cumulative money refunded via partial (per-item) refunds. > 0 means the order is partially refunded.
        refundMethod:
          type: string
          nullable: true
          description: Method of the most recent refund on this order ("cash" or "voucher"). Captured so a refund-slip reprint can show how the customer was refunded. NULL = never refunded.
        refundedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent refund, so a refund-slip reprint shows the true refund date. NULL = never refunded.
        paymentMethod:
          type: string
          nullable: true
        cardType:
          type: string
          nullable: true
          description: For card payments (or the card portion of a split) — "debit" or "credit". Printed on the receipt as "Debit Card" / "Credit Card". NULL for non-card payments. Distinct from the "credit" paymentMethod, which is an on-account / store-credit sale.
        splitCardAmount:
          type: number
          format: float
          nullable: true
        splitCashAmount:
          type: number
          format: float
          nullable: true
        cashTendered:
          type: number
          format: float
          nullable: true
          description: Cash amount tendered by the customer (cash payments). Used to display change due on the POS popup and printed receipt. NULL = not recorded.
        giftVoucherId:
          type: integer
          nullable: true
          description: Id of the gift voucher redeemed as a tender on this sale, if any.
        giftVoucherCode:
          type: string
          nullable: true
          description: Code of the gift voucher redeemed on this sale (snapshot for receipts/reports).
        giftVoucherAmount:
          type: number
          format: float
          nullable: true
          description: Portion of `total` paid by a redeemed gift voucher. The remainder (total - giftVoucherAmount) is collected via paymentMethod.
        notes:
          type: string
          nullable: true
        voidReason:
          type: string
          nullable: true
        customerId:
          type: integer
          nullable: true
        staffName:
          type: string
          nullable: true
          description: Display name of the cashier/staff who rang up the sale (joined from staff by staffId). Printed on receipts.
        stationNumber:
          type: integer
          nullable: true
          description: Station/till number assigned to the cashier's open shift, stamped onto the sale and printed on receipts.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - orderNumber
        - status
        - subtotal
        - tax
        - total
        - items
        - createdAt

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        refundedQuantity:
          type: number
          format: float
          nullable: true
          description: Cumulative quantity refunded for this line. Originally-sold quantity = quantity + refundedQuantity.
        unitPrice:
          type: number
          format: float
        originalUnitPrice:
          type: number
          format: float
          nullable: true
          description: Original (pre-tier) unit price; used to compute volume-pricing savings on receipts.
        discountAmount:
          type: number
          format: float
          nullable: true
        variantAdjustment:
          type: number
          format: float
          nullable: true
        modifierAdjustment:
          type: number
          format: float
          nullable: true
        variantChoices:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChoiceItem"
        modifierChoices:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ChoiceItem"
        lineTotal:
          type: number
          format: float
        sellingUnit:
          type: string
          nullable: true
          description: Optional free-text selling unit / UOM label of the product (e.g. "each", "case"). Surfaced on the POS and receipts. NULL = not set.
        isTaxable:
          type: boolean
          description: Whether the product is taxable (resolved live from the product). Surfaced so receipts can mark lines as T (taxable) or N (non-taxable).
        notes:
          type: string
          nullable: true
          description: Optional free-text per-line note (e.g. "cut thin", "extra lean"). Surfaced on receipts. NULL = none.
      required:
        - id
        - productId
        - productName
        - quantity
        - unitPrice
        - lineTotal

    CreateOrderBody:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
                description: Required for catalog products. Omit for a custom/miscellaneous item, in which case customName and customPrice are used.
              quantity:
                type: integer
              discountAmount:
                type: number
                format: float
              customName:
                type: string
                description: Display name for a custom/miscellaneous item not in the catalog. Used only when productId is omitted.
              customPrice:
                type: number
                format: float
                description: Unit price for a custom/miscellaneous item not in the catalog. Used only when productId is omitted.
              variantChoices:
                type: array
                items:
                  $ref: "#/components/schemas/ChoiceItem"
              modifierChoices:
                type: array
                items:
                  $ref: "#/components/schemas/ChoiceItem"
              notes:
                type: string
                description: Optional per-line note entered at the POS (e.g. "cut thin, extra lean"). Persisted on the order item and printed on receipts.
            required:
              - quantity
        paymentMethod:
          type: string
        cardType:
          type: string
          description: For card payments (or the card portion of a split) — "debit" or "credit". Printed on the receipt. Distinct from the "credit" paymentMethod, which is an on-account / store-credit sale.
        splitCardAmount:
          type: number
          format: float
        splitCashAmount:
          type: number
          format: float
        cashTendered:
          type: number
          format: float
          description: Cash amount tendered by the customer for cash payments.
        discountType:
          type: string
          enum: [percent, fixed]
        discountAmount:
          type: number
          format: float
        notes:
          type: string
        stationNumber:
          type: integer
          description: Station/till number from the open cash session, stamped onto the sale so it prints on receipts.
        customerId:
          type: integer
        tableId:
          type: integer
        staffId:
          type: integer
        orderType:
          type: string
          enum: [counter, dine-in, takeout, delivery]
        loyaltyPointsToRedeem:
          type: integer
        giftVoucherCode:
          type: string
          description: Gift voucher code to redeem as a tender against this sale. The server locks the voucher, applies min(balance, total), and records a redeem ledger entry. Does not change subtotal/tax/total.
